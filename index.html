<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACL Directory | AI Creator Labs</title>
<meta name="description" content="Direktori skill, video, dan artikel untuk belajar AI. Gratis, padat, dan mudah dicari.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@1,7..72,500;1,7..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--v0:#09081a;--v1:#201349;--v2:#38227e;--v3:#7551d0;--v4:#926cee;--v5:#b496ff;--v6:#d6c6ff;
--bg:#04030c;--panel:#0a0818;--card:#0c0a1d;--ink:#f1f0fb;--mute:#b4b2cf;--dim:#8381a8;--line:rgba(200,196,255,.12);--line2:rgba(200,196,255,.24);
--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif;--sw:248px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 62% -6%,rgba(117,81,208,.28),transparent 70%),radial-gradient(40% 30% at 0% 100%,rgba(60,50,190,.16),transparent 70%)}
a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
em{font-style:normal}i{font-style:normal}
:focus-visible{outline:2px solid var(--v5);outline-offset:2px}
svg{display:block}
#fx{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;align-self:flex-start;width:var(--sw);height:100vh;flex:none;z-index:60;transition:width .3s cubic-bezier(.2,.8,.2,1)}
.si{position:absolute;top:0;left:0;bottom:0;width:248px;display:flex;flex-direction:column;background:rgba(7,5,18,.92);border-right:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;transition:width .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px 10px;min-height:66px}
.logo{display:block;flex:none}.logo img{height:34px;width:auto}.logo .li{display:none;height:34px}
.sx,.scb{display:inline-grid;width:32px;height:32px;border-radius:9px;color:var(--mute);place-items:center;flex:none;transition:.2s}
.scb:hover,.sx:hover{background:rgba(180,150,255,.1);color:#fff}
.sx{display:none}.sx svg,.scb svg{width:17px;height:17px}
.sb{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 12px;scrollbar-width:none}.sb::-webkit-scrollbar{display:none}
.sg{font:600 10.5px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:16px 10px 8px;white-space:nowrap}
.nv{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:9px;color:var(--mute);font-weight:500;font-size:13.5px;text-align:left;white-space:nowrap;transition:background .2s,color .2s}
.nv{position:relative;color:#fff}
.nv:hover{background:rgba(180,150,255,.07)}
.nv .lb{position:relative;display:inline-block;padding:3px 0}
.nv.on .lb{background:linear-gradient(90deg,var(--v6),var(--v4));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:600}
.nv.on::before{content:"";position:absolute;left:-4px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--v5);box-shadow:0 0 8px 1px var(--v4)}
.nv .ic{width:18px;height:18px;flex:none;display:inline-grid;place-items:center;color:#fff;transition:color .2s}.nv .ic svg{width:18px;height:18px}
.nv.on .ic{color:var(--v5)}
.nv .ci{width:22px;height:22px;border-radius:7px;background:none;box-shadow:none;color:#fff;transition:color .2s}.nv .ci svg{width:15px;height:15px;filter:none}
.nv.on .ci{color:var(--v5)}
.nv .lvm .lv{background:none;border:1px solid rgba(255,255,255,.55);color:#fff;transition:.2s}.nv.on .lvm .lv{border-color:var(--v5);color:var(--v5)}
.nv .lvm{width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.sf{white-space:nowrap;padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--dim);font-size:12px}
.soc{display:flex;gap:6px}.soc a{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);transition:.2s}.soc a:hover{color:#fff;border-color:var(--line2)}.soc svg{width:16px;height:16px}
@media(min-width:1001px){
body.sc{--sw:68px}
body.sc .si{width:68px}
body.sc .side:hover .si{width:248px;box-shadow:30px 0 80px -30px #000}
body.sc .side:not(:hover) .sh{flex-direction:column;justify-content:center;gap:6px;padding:14px 0 6px}
body.sc .side:not(:hover) .logo .lw{display:none}body.sc .side:not(:hover) .logo .li{display:block}
body.sc .side:not(:hover) .scb svg{transform:scaleX(-1)}
body.sc .side:not(:hover) .lb,body.sc .side:not(:hover) .sf span{display:none}
body.sc .side:not(:hover) .sg{font-size:0;padding:0;margin:10px 12px 8px;border-top:1px solid var(--line);height:0}
body.sc .side:not(:hover) .sf{justify-content:center;padding:12px 0}body.sc .side:not(:hover) .soc{display:none}
body.sc .side:not(:hover) .nv{padding:0;justify-content:center}
body.sc .side:not(:hover) .nv .ic,body.sc .side:not(:hover) .nv .lvm{margin:0}
}
.sh2 .cn{margin-left:auto;display:inline-flex;gap:6px}.sh2 .cn+.more{margin-left:14px}
.cb2{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--v6);transition:.2s}.cb2:hover{border-color:rgba(180,150,255,.6);color:#fff;background:rgba(146,108,238,.15)}.cb2 svg{width:15px;height:15px}
.grid.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}.grid.car::-webkit-scrollbar{display:none}
.grid.car .cd{flex:0 0 calc((100% - 42px)/4);min-width:0;scroll-snap-align:start}
@media(max-width:1100px){.grid.car .cd{flex-basis:calc((100% - 28px)/3)}}
@media(max-width:800px){.grid.car .cd{flex-basis:calc((100% - 14px)/2)}}
.grid.skl.s3{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
.skl.s3 .sk{column-gap:16px;padding:22px 8px}.skl.s3 .sk h3{font-size:16.5px}
@media(max-width:1100px){.grid.skl.s3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.grid.skl.s3{grid-template-columns:1fr}}
.grid.ga .ty,.grid.ga .dur{display:none}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:1100px){.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid.skl{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;border-top:1px solid var(--line)}
.sk{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto auto;column-gap:20px;row-gap:4px;align-items:center;text-align:left;padding:26px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .35s,box-shadow .35s}
.sk .abw{grid-column:1;grid-row:1/4;display:grid;place-items:center;width:50px;height:50px}
.sk .ab{width:48px;height:48px;overflow:visible;filter:drop-shadow(0 0 7px var(--a));transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .3s}
.sk:hover .ab{transform:scale(1.14);filter:drop-shadow(0 0 13px var(--a))}
.rg{transform-origin:24px 24px}.sk:hover .rg{animation:rspin 2.4s linear infinite}@keyframes rspin{to{transform:rotate(360deg)}}
.sk .slug{grid-column:2;grid-row:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#9b99ba;align-self:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk h3{grid-column:2;grid-row:2;font-size:18px;font-weight:500;margin:0}
.sk p{grid-column:2;grid-row:3;font-size:14px;line-height:1.45;color:#a9a7c6;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk .sar{grid-column:3;grid-row:1/4;width:28px;height:28px;color:#a9a7c6;transition:transform .45s cubic-bezier(.2,.8,.2,1),color .3s}
.sk:hover,.sk:focus-visible{background:linear-gradient(90deg,rgba(146,108,238,.3),rgba(146,108,238,.06) 70%,transparent);box-shadow:inset 3px 0 0 #b496ff}
.sk h3,.sk .slug,.sk p{transition:transform .4s cubic-bezier(.2,.8,.2,1),color .3s}
.sk:hover h3,.sk:hover .slug,.sk:hover p{transform:translateX(6px)}.sk:hover .slug{color:var(--v6)}.sk:hover p{color:#e4dcff}
.sk:hover .sar{transform:translateX(10px);color:#fff;filter:drop-shadow(0 0 8px rgba(190,160,255,.9))}
@media(prefers-reduced-motion:reduce){.sk:hover h3,.sk:hover .slug,.sk:hover p,.sk:hover .sar{transform:none}.sk:hover .rg{animation:none}}
@media(max-width:900px){.grid.skl{grid-template-columns:1fr}}
@media(max-width:700px){.sk{padding:20px 4px;column-gap:14px}.sk h3{font-size:16px}.sk .sar{width:22px;height:22px}}
/* category icon */
.ci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;flex:none;background:radial-gradient(125% 95% at 50% 128%,var(--a) 0%,var(--b) 38%,transparent 72%),linear-gradient(180deg,#06050e,#13101f);box-shadow:inset 0 -6px 9px -5px var(--a),inset 0 0 0 1px rgba(255,255,255,.16),0 0 14px -3px var(--b);color:#fff}
.ci svg{width:11px;height:11px;fill:currentColor;filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
/* main */
.main{flex:1;min-width:0;position:relative}
.main>*{position:relative;z-index:1}
.main>.glow{position:absolute;z-index:0;left:0;right:0;bottom:0;height:520px;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent);mask-image:linear-gradient(to top,#000 30%,transparent)}
.glow i{position:absolute;bottom:-45%;border-radius:50%;filter:blur(60px);will-change:transform,opacity}
.glow i:nth-child(1){left:-5%;width:60%;height:100%;background:radial-gradient(closest-side,rgba(117,81,208,.77),transparent);animation:gl1 11s ease-in-out infinite alternate}
.glow i:nth-child(2){right:-10%;width:65%;height:110%;background:radial-gradient(closest-side,rgba(90,100,255,.59),transparent);animation:gl2 14s ease-in-out infinite alternate}
.glow i:nth-child(3){left:25%;width:50%;height:80%;background:radial-gradient(closest-side,rgba(180,150,255,.45),transparent);animation:gl3 9s ease-in-out infinite alternate}
@keyframes gl1{from{transform:translate(0,0) scale(1);opacity:.75}to{transform:translate(12%,-6%) scale(1.12);opacity:1}}
@keyframes gl2{from{transform:translate(0,0) scale(1.05);opacity:1}to{transform:translate(-14%,-4%) scale(.95);opacity:.7}}
@keyframes gl3{from{transform:translate(-8%,0) scale(.95);opacity:.5}to{transform:translate(8%,-8%) scale(1.1);opacity:.9}}
@media(prefers-reduced-motion:reduce){.glow i{animation:none}}
.btt{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:999px;border:1px solid rgba(180,150,255,.35);background:rgba(20,14,50,.55);color:#fff;font:600 12px/1 var(--disp);letter-spacing:.04em;transition:.25s}
.btt:hover{border-color:rgba(180,150,255,.8);background:rgba(146,108,238,.25);box-shadow:0 0 22px -4px var(--v4);transform:translateY(-2px)}
.btt svg{width:14px;height:14px;transform:rotate(-90deg);color:var(--v6)}
.foot{align-items:center}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 24px;background:rgba(4,3,12,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ban .bt{position:relative}.hb{display:none;width:36px;height:36px;border-radius:9px;place-items:center;border:1px solid var(--line)}.hb svg{width:18px;height:18px}
.tlogo{display:none}.tlogo img{height:28px;width:auto}
.stg{flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--dim);font-size:13px;text-align:left;transition:border-color .2s,background .2s}
.stg:hover{border-color:var(--line2);background:rgba(255,255,255,.06);color:var(--mute)}
.stg svg{width:16px;height:16px;flex:none}.stg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:500 11px/1 var(--disp);padding:5px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.03)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .2s,background .2s,border-color .2s}
.btn.g{color:var(--mute)}.btn.g:hover{color:#fff}
.btn.p{background:linear-gradient(180deg,#d6c6ff,#b39bff);color:#150f33;border:1px solid rgba(255,255,255,.4)}.btn.p:hover{transform:translateY(-1px);background:linear-gradient(180deg,#e6dcff,#c0aaff)}
.btn.o{border:1px solid var(--line2);color:#fff}.btn.o:hover{background:rgba(180,150,255,.1)}
.btn svg{width:15px;height:15px}
/* hero */
.hero{position:relative;overflow:hidden;margin:18px 24px 0;padding:34px 34px 30px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(32,19,73,.5),rgba(9,8,26,.4))}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 120% at 85% -20%,rgba(146,108,238,.38),transparent 62%),radial-gradient(50% 90% at 5% 120%,rgba(70,90,255,.22),transparent 65%)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(200,196,255,.16) 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%);mask-image:linear-gradient(90deg,transparent 30%,#000 100%);opacity:.7}
.hero>*{position:relative;z-index:1}
.eb{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--v6);opacity:.9}
.eb::before{content:"";width:6px;height:6px;background:var(--v5);box-shadow:0 0 10px var(--v4)}
h1{font:600 clamp(28px,3.6vw,46px)/1.08 var(--disp);letter-spacing:-.03em;margin:14px 0 10px;max-width:760px}
h1 .sr{font:italic 500 1em/1 var(--serif);letter-spacing:-.01em;color:var(--v6)}
.lead{max-width:640px;color:var(--mute);font-size:15px}
.hs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.hsb{flex:1 1 320px;max-width:520px;display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 14px;border-radius:12px;background:rgba(8,6,22,.55);border:1px solid rgba(206,190,255,.38);color:var(--mute);font-size:14px;text-align:left;box-shadow:0 0 28px -8px rgba(140,105,255,.5);transition:border-color .2s}
.hsb:hover{border-color:rgba(226,214,255,.7)}.hsb svg{width:18px;height:18px;flex:none}.hsb span{flex:1}

.hm b{color:var(--ink);font-weight:600;margin-right:5px}
/* sections */
.wrap{padding:0 24px 60px}
.sec{margin-top:36px}
.sh2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh2 h2{font:600 17px/1 var(--disp);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.sh2 h2 svg{width:18px;height:18px;color:var(--v5)}
.sh2 .c{font:500 12px/1 var(--disp);color:var(--dim)}
.sh2 .more{margin-left:auto;font:500 12.5px/1 var(--disp);color:var(--v5);display:inline-flex;align-items:center;gap:6px;padding:6px 0}.sh2 .more:hover{color:#fff}
.sh2 .more svg{width:13px;height:13px}
/* banner */
.ban{position:relative;overflow:hidden;margin:18px 24px 0;min-height:176px;border-radius:16px;border:1px solid var(--line);background:#07051a;display:flex;align-items:center;isolation:isolate}
.ban .bi{position:absolute;z-index:-2;right:0;top:0;bottom:0;width:66%;background:var(--img) center var(--py,35%)/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 60%);mask-image:linear-gradient(90deg,transparent 0%,#000 60%)}
.ban::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,5,26,.96) 0%,rgba(24,16,70,.72) 42%,rgba(40,30,120,.22) 100%)}

.ban.full::before{background:linear-gradient(90deg,rgba(7,5,26,.55) 0%,rgba(24,16,70,.25) 45%,transparent 80%)}
.bt{padding:26px 34px;max-width:640px}
.bc{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.bc a{color:var(--v6)}.bc a:hover{color:#fff}.bc i{opacity:.5}
.ban h1{margin:12px 0 8px;font-size:clamp(26px,3vw,38px)}
.ban p{color:var(--mute);font-size:14.5px;max-width:480px}

.tabs{display:inline-flex;gap:4px}

// cursor trail: dot with a tapered comet tail, ring on interactive elements
(()=>{const c=$("#trail");if(!c)return;if(matchMedia("(pointer:coarse),(prefers-reduced-motion:reduce)").matches){c.remove();return}
const x=c.getContext("2d");let W,H,run=false,vis=false,hover=false,still=0,tx=0,ty=0,dx=0,dy=0,rad=5,ring=0,hist=[];
const SEL="a,button,input,select,textarea,summary,[role=button],[data-act],.cd,.chip,.tab,.nv,.pt";
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)}
size();addEventListener("resize",size);
addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;tx=e.clientX;ty=e.clientY;const el=e.target&&e.target.closest&&e.target.closest(SEL);hover=!!el;if(!vis){vis=true;dx=tx;dy=ty;hist=[]}still=0;if(!run){run=true;requestAnimationFrame(loop)}},{passive:true});
document.addEventListener("pointerleave",()=>{vis=false});document.addEventListener("pointerenter",()=>{});
function loop(){x.clearRect(0,0,W,H);
dx+=(tx-dx)*.2;dy+=(ty-dy)*.2;ring+=((hover?1:0)-ring)*.22;
hist.push({x:dx,y:dy});if(hist.length>26)hist.shift();
const sp=Math.hypot(tx-dx,ty-dy);
const n=hist.length;
if(n>2&&ring<.95){x.globalCompositeOperation="lighter";
for(let i=1;i<n;i++){const a=hist[i-1],b=hist[i],k=i/n,w=1+6*k*k,al=.95*k*k*(1-ring);if(al<.01)continue;
const g=x.createLinearGradient(a.x,a.y,b.x,b.y);const col="rgba("+Math.round(120+40*k)+","+Math.round(130+30*k)+",255,"+al+")";g.addColorStop(0,col);g.addColorStop(1,col);
x.strokeStyle=col;x.lineWidth=w;x.lineCap="butt";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
x.globalCompositeOperation="source-over";
const r=5+(15-5)*ring;
if(vis){const gl=x.createRadialGradient(dx,dy,0,dx,dy,r*3.2);gl.addColorStop(0,"rgba(130,140,255,"+(.5*(1-ring*.7))+")");gl.addColorStop(1,"rgba(110,120,255,0)");x.fillStyle=gl;x.beginPath();x.arc(dx,dy,r*3.2,0,6.283);x.fill();
if(ring<.5){x.fillStyle="rgba(176,170,255,"+(1-ring*2)+")";x.beginPath();x.arc(dx,dy,r,0,6.283);x.fill();x.fillStyle="rgba(235,232,255,"+(1-ring*2)+")";x.beginPath();x.arc(dx,dy,r*.45,0,6.283);x.fill()}

if(!vis){x.clearRect(0,0,W,H);run=false;return}
if(still>32){run=false;return}
requestAnimationFrame(loop)}})();

(()=>{const c=$("#fx");if(!c||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const x=c.getContext("2d");
const spr=document.createElement("canvas");spr.width=spr.height=32;{const g=spr.getContext("2d"),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,"rgba(235,228,255,1)");r.addColorStop(.18,"rgba(190,170,255,.9)");r.addColorStop(.45,"rgba(130,110,255,.28)");r.addColorStop(1,"rgba(110,90,255,0)");g.fillStyle=r;g.fillRect(0,0,32,32)}
let W,H,P=[];function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0);
